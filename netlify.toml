# Netlify configuration for static site hosting
# Note: This will only serve the frontend files, not the backend API

[build]
  publish = "."
  command = "echo 'Static site build complete'"

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
